version: '3.8'

networks:
  poppins-network:
    driver: bridge

services:
  n8n:
    container_name: n8n
    image: ${N8N_IMAGE}
    dns:
      - 1.1.1.1
      - 1.0.0.1
      - 8.8.8.8
      - 8.8.4.4
    dns_search:
      - googleapis.com
    extra_hosts:
      - "generativelanguage.googleapis.com:172.217.31.170"
      - "host.docker.internal:host-gateway"
    environment:
      - N8N_SECURE_COOKIE=${N8N_SECURE_COOKIE}
      - N8N_AUTH_ENABLED=${N8N_AUTH_ENABLED}
      - DB_SQLITE_POOL_SIZE=${DB_SQLITE_POOL_SIZE}
      - N8N_RUNNERS_ENABLED=${N8N_RUNNERS_ENABLED}
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=${N8N_BLOCK_ENV_ACCESS_IN_NODE}
      - N8N_GIT_NODE_DISABLE_BARE_REPOS=${N8N_GIT_NODE_DISABLE_BARE_REPOS}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - GOOGLE_GENERATIVE_AI_API_KEY=${GOOGLE_API_KEY}
    ports:
      - "${N8N_PORT}:5678"
    volumes:
      - ./volume-n8n:/home/node/.n8n
      - ./workflows:/workflows
      - ./init-workflows.sh:/init-workflows.sh
    entrypoint: /bin/sh
    command: /init-workflows.sh
    restart: always
    networks:
      - poppins-network

  mysql:
    container_name: mysql
    image: ${MYSQL_IMAGE}
    restart: always
    ports:
      - "${MYSQL_PORT}:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
    volumes:
      - ./volume-mysql:/var/lib/mysql
      - ./init-data.sh:/docker-entrypoint-initdb.d/init-data.sh
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-u', 'root', '-p${MYSQL_ROOT_PASSWORD}']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - poppins-network

  kafka:
    container_name: kafka
    image: ${KAFKA_IMAGE}
    ports:
      - '${KAFKA_PORT}:9092'
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    volumes:
      - ./volume-kafka:/var/lib/kafka/data
    networks:
      - poppins-network

  redis: 
    container_name: redis
    image: ${REDIS_IMAGE}
    ports:
      - ${REDIS_PORT}:6379
    command: redis-server /usr/local/etc/redis/redis.conf
    volumes:
      - ./volume-redis:/data
      - ./redis.conf:/usr/local/etc/redis/redis.conf
    networks:
      - poppins-network
    restart: always
